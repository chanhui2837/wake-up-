name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 웹 화면을 앱에 넣기
        run: cp public/index.html public/logo.svg android/app/src/main/assets/

      - name: APK 빌드
        run: gradle -p android assembleRelease -Pvc=${{ github.run_number }} --stacktrace

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk wakeup-alarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wakeup-alarm-apk
          path: wakeup-alarm.apk

      - name: 릴리스로 공개 (다운로드 링크 고정)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 깨워알람 v1.0.${{ github.run_number }}
          body: 안드로이드 앱 설치 파일입니다. wakeup-alarm.apk 를 받아 설치하세요.
          files: wakeup-alarm.apk
          make_latest: true
