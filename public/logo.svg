<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#23206A"/>
      <stop offset="0.5" stop-color="#57288A"/>
      <stop offset="0.82" stop-color="#D9457D"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FFF6C4"/>
      <stop offset="0.45" stop-color="#FFD36E"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15123F"/>
      <stop offset="1" stop-color="#3A1E66"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE69A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB86B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB86B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fc"><circle cx="60" cy="64" r="29"/></clipPath>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <circle cx="60" cy="70" r="50" fill="url(#glow)"/>

  <!-- 별 -->
  <g fill="#fff">
    <circle cx="20" cy="20" r="1.3" opacity=".85"/>
    <circle cx="99" cy="15" r="1.1" opacity=".8"/>
    <circle cx="104" cy="44" r=".9" opacity=".6"/>
    <circle cx="13" cy="50" r=".9" opacity=".55"/>
    <path d="M88 26l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z" opacity=".9"/>
  </g>

  <!-- 울리는 선 -->
  <g stroke="#FFE7A8" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M18.5 33.5c-2.5-4.5-1.5-9.5 2.5-13"/>
    <path d="M101.5 33.5c2.5-4.5 1.5-9.5-2.5-13"/>
  </g>

  <!-- 종 -->
  <path d="M25 41.5A16 16 0 0 1 47.5 19.5Z" fill="url(#bell)"/>
  <path d="M95 41.5A16 16 0 0 0 72.5 19.5Z" fill="url(#bell)"/>
  <rect x="56.5" y="22" width="7" height="8" rx="2.5" fill="#FFF3DF"/>

  <!-- 다리 -->
  <g stroke="#FFF3DF" stroke-width="5.5" stroke-linecap="round">
    <path d="M41 94l-6.5 8.5"/><path d="M79 94l6.5 8.5"/>
  </g>

  <!-- 시계 몸통 -->
  <circle cx="60" cy="64" r="36" fill="#FFF3DF"/>
  <circle cx="60" cy="64" r="29" fill="url(#face)"/>

  <!-- 시계 안의 해돋이 -->
  <g clip-path="url(#fc)">
    <g stroke="#FFD36E" stroke-width="2.6" stroke-linecap="round" opacity=".9">
      <path d="M60 64.5v-4.5"/><path d="M44.5 70.5l-3.2-3.2"/><path d="M75.5 70.5l3.2-3.2"/>
      <path d="M38 80.5h-4.5"/><path d="M82 80.5h4.5"/>
    </g>
    <circle cx="60" cy="84" r="15" fill="url(#sun)"/>
    <rect x="20" y="83" width="80" height="20" fill="#2A1752"/>
    <path d="M30 86.5h60" stroke="#FF8A4C" stroke-width="1.6" opacity=".7"/>
    <path d="M38 90.5h44" stroke="#FF8A4C" stroke-width="1.2" opacity=".4"/>
  </g>

  <!-- 바늘 -->
  <g stroke="#FFF3DF" stroke-linecap="round">
    <path d="M60 60V43" stroke-width="3.6"/>
    <path d="M60 60l10.5-6" stroke-width="3.6"/>
  </g>
  <circle cx="60" cy="60" r="4" fill="#FF4D8D" stroke="#FFF3DF" stroke-width="2"/>
</svg>
